<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Athena</title>
    
    <!-- Fonte Inter do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Link do CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="header-inner">
            
            <!-- Logo -->
            <a href="#" class="logo">
                <img src="assets/logoathena.png" alt="Logo da Biblioteca Athena">
                <h2>Ath<span>ena</span></h2>
            </a>

            <!-- Menu de navegação -->
            <ul class="nav" id="nav">
                <li><a href="#">Início</a></li>
                <li><a href="#">Meus Livros</a></li>
                <li><a href="#">Autores</a></li>
                <li><a href="#">Gêneros</a></li>
                <li><a href="#">Avaliações</a></li>
                <li><a href="#">Contato</a></li>  
            </ul>

            <!-- Botões de ação -->
            <div class="actions">
                <a href="#" class="btn btn-entrar">Entrar</a>
                <a href="#" class="btn btn-cadastrar">Cadastrar</a>
            </div>

            <!-- Botão Hambúrguer para telas pequenas (Passo 1) -->
            <button class="hamburguer" id="btn-menu" aria-label="Abrir Menu">☰</button>

        </div>
    </header>

    <!-- Conexão do arquivo JavaScript (Passo 1) -->
    <script src="script.js"></script>
</body>
</html>
